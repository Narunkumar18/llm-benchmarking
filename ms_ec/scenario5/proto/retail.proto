syntax = "proto3";

package retail;

// ========================================
// Inventory Service
// ========================================
service InventoryService {
  rpc CheckStock (CheckStockRequest) returns (CheckStockResponse);
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockResponse);
  rpc ReleaseStock (ReleaseStockRequest) returns (ReleaseStockResponse);
  rpc InitializeStock (InitializeStockRequest) returns (InitializeStockResponse);
  rpc ClearInventory (Empty) returns (Empty);
}

message CheckStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckStockResponse {
  bool available = 1;
  int32 current_stock = 2;
  string message = 3;
}

message ReserveStockRequest {
  string order_id = 1;
  string product_id = 2;
  int32 quantity = 3;
  int32 delay_ms = 4;
}

message ReserveStockResponse {
  bool success = 1;
  string reservation_id = 2;
  string message = 3;
  int32 request_bytes = 4;
  int32 response_bytes = 5;
}

message ReleaseStockRequest {
  string order_id = 1;
  string reservation_id = 2;
}

message ReleaseStockResponse {
  bool success = 1;
  string message = 2;
}

message InitializeStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message InitializeStockResponse {
  bool success = 1;
  string message = 2;
}

// ========================================
// Payment Service
// ========================================
service PaymentService {
  rpc ProcessPayment (ProcessPaymentRequest) returns (ProcessPaymentResponse);
  rpc GetPaymentStatus (GetPaymentStatusRequest) returns (GetPaymentStatusResponse);
  rpc ClearPayments (Empty) returns (Empty);
}

message ProcessPaymentRequest {
  string order_id = 1;
  double amount = 2;
  string payment_method = 3;
  int32 delay_ms = 4;
}

message ProcessPaymentResponse {
  bool success = 1;
  string payment_id = 2;
  string status = 3;
  string message = 4;
  int32 request_bytes = 5;
  int32 response_bytes = 6;
}

message GetPaymentStatusRequest {
  string payment_id = 1;
}

message GetPaymentStatusResponse {
  string payment_id = 1;
  string status = 2;
  double amount = 3;
  string timestamp = 4;
}

// ========================================
// Tracking Service
// ========================================
service TrackingService {
  rpc InitiateTracking (InitiateTrackingRequest) returns (InitiateTrackingResponse);
  rpc UpdateTrackingStatus (UpdateTrackingStatusRequest) returns (UpdateTrackingStatusResponse);
  rpc GetTrackingStatus (GetTrackingStatusRequest) returns (GetTrackingStatusResponse);
  rpc ClearTracking (Empty) returns (Empty);
}

message InitiateTrackingRequest {
  string order_id = 1;
  int32 delay_ms = 2;
}

message InitiateTrackingResponse {
  bool success = 1;
  string tracking_id = 2;
  string status = 3;
  string message = 4;
  int32 request_bytes = 5;
  int32 response_bytes = 6;
}

message UpdateTrackingStatusRequest {
  string tracking_id = 1;
  string status = 2;
}

message UpdateTrackingStatusResponse {
  bool success = 1;
  string message = 2;
}

message GetTrackingStatusRequest {
  string tracking_id = 1;
}

message GetTrackingStatusResponse {
  string tracking_id = 1;
  string order_id = 2;
  string status = 3;
  string timestamp = 4;
  repeated string status_history = 5;
}

// ========================================
// Order Service
// ========================================
service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrderStatus (GetOrderStatusRequest) returns (GetOrderStatusResponse);
  rpc ClearOrders (Empty) returns (Empty);
}

message CreateOrderRequest {
  string product_id = 1;
  int32 quantity = 2;
  double amount = 3;
  bool parallel_processing = 4;
  int32 delay_ms = 5;
}

message CreateOrderResponse {
  bool success = 1;
  string order_id = 2;
  string status = 3;
  string payment_id = 4;
  string tracking_id = 5;
  string reservation_id = 6;
  string message = 7;
  OrderMetrics metrics = 8;
}

message OrderMetrics {
  double total_time = 1;
  double inventory_time = 2;
  double payment_time = 3;
  double tracking_time = 4;
  int32 total_request_bytes = 5;
  int32 total_response_bytes = 6;
}

message GetOrderStatusRequest {
  string order_id = 1;
}

message GetOrderStatusResponse {
  string order_id = 1;
  string status = 2;
  string product_id = 3;
  int32 quantity = 4;
  double amount = 5;
  string payment_id = 6;
  string tracking_id = 7;
  string created_at = 8;
  string updated_at = 9;
}

// ========================================
// Common Messages
// ========================================
message Empty {}
